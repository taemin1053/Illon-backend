# application.properties


spring.application.name=analytics


#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration


spring.datasource.url=jdbc:postgresql://15.164.247.11:5432/career_analytics
spring.datasource.username=postgres
spring.datasource.password=hostpost1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.data.jpa.repositories.enabled=true


jwt.secret=yourSecretKeyHereMustBeLongEnoughForHS512AtLeast64CharactersMinimumRequiredForHS512Algorithm

jwt.expiration=86400000

# ===================================
# Server Configuration
# ===================================
server.port=8080

# ===================================
# Logging Configuration
# ===================================
logging.level.com.career.analytics=DEBUG
logging.level.org.springframework.security=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================
# Error Handling
# ===================================
server.error.include-message=always
server.error.include-stacktrace=on_param

# ===================================
# Encoding
# ===================================
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
